    <div id="xs-demo-toolbar">

      <span id="xs-mode-label">⚡ Modo: <strong>Painel Liberado</strong></span>
      <button id="xs-toggle-btn" onclick="toggleXsDemoMode()">Ver Landing Page</button>
    </div>

    <script>
      function updateToolbarDisplay() {
        var isDemo = localStorage.getItem('xs_demo_mode') !== 'false';
        var label = document.getElementById('xs-mode-label');
        var btn = document.getElementById('xs-toggle-btn');
        if (isDemo) {
          label.innerHTML = '⚡ Modo: <strong>Painel Liberado</strong>';
          btn.textContent = 'Ver Landing Page';
          btn.style.background = '#334155';
        } else {
          label.innerHTML = '🌐 Modo: <strong>Landing Page</strong>';
          btn.textContent = 'Acessar Painel';
          btn.style.background = '#0284c7';
        }
      }

      function toggleXsDemoMode() {
        var isDemo = localStorage.getItem('xs_demo_mode') !== 'false';
        localStorage.setItem('xs_demo_mode', isDemo ? 'false' : 'true');
        window.location.href = '/';
      }

      updateToolbarDisplay();
    </script>
